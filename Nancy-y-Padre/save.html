<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Save the date — Nancy &amp; Pedro</title>
<link rel="icon" type="image/png" href="img/Favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Jost:wght@300;400;500&family=DM+Serif+Display&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#FFF7EF;
    --terracotta:#c0561f;
    --slate:#4a5a66;
    --ink:#3e4b54;
    --rule:rgba(192,86,31,.55);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:#e9ddd6;font-family:'Jost',system-ui,sans-serif;display:flex;justify-content:center}
  a{color:var(--terracotta);text-decoration:none}
  a:hover{color:#9b4116}

  /*.card{width:100%;max-width:420px;min-height:100vh;background:var(--blush);padding:46px 26px 40px;display:flex;flex-direction:column;align-items:center;box-shadow:0 24px 60px rgba(64,44,30,.14)}*/
  .card{position:relative;overflow:hidden;width:390px;max-width:100%;min-height:100vh;background:var(--blush);padding:46px 26px 40px;display:flex;flex-direction:column;align-items:center;box-shadow:0 24px 60px rgba(64,44,30,.14)}

  /*.card{width:390px;max-width:100%}*/

   /* ---------- flores decorativas ---------- */
  .flor{position:absolute;pointer-events:none;user-select:none;z-index:0;opacity:0;animation:fadeIn 1.4s forwards}
.flor-top{top:0%;left:0%;width:30%;animation-delay:.1s}
.flor-mid{bottom:200px;left:0%;width:15%;animation-delay:1.3s}
.flor-bot{bottom:0%;right:0%;width:30%;animation-delay:1.5s}
  @keyframes fadeIn{to{opacity:1}}
  .card > h1,.card > .photos,.card > p,.card > .countdown{position:relative;z-index:2}
  /* ---------- fade in ---------- */
  .fade{opacity:0;transform:translateY(14px);animation:fadeUp 1s cubic-bezier(.22,.7,.24,1) forwards}
  .fade.d1{animation-delay:.05s}
  .fade.d2{animation-delay:.45s}
  .fade.d3{animation-delay:.85s}
  .fade.d4{animation-delay:1.25s}
  .fade.d5{animation-delay:1.35s}
  .fade.d6{animation-delay:1.55s}
  .fade.d7{animation-delay:2.05s}
  .fade.d8{animation-delay:2.25s}

  @keyframes fadeUp{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.fade{animation:none;opacity:1;transform:none}}

  h1{font-family:'Allura',cursive;font-weight:400;font-size:48px;line-height:1.1;color:var(--ink);margin:0 0 30px;text-align:center}

  .photos{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;width:100%}
  .photo{position:relative;aspect-ratio:3/4.4;overflow:hidden;background:#FFF7EF}
  .photo img{width:100%;height:100%;object-fit:cover;display:block}
  .photo .num{position:absolute;left:0;right:0;bottom:-8px;text-align:center;font-family:'DM Serif Display',serif;font-weight:400;font-size:70px;line-height:.9;color:var(--blush)}

  .eyebrow{font-size:16px;font-weight:300;color:var(--slate);margin:30px 0 0;letter-spacing:.01em}
  h2{font-family:'Allura',cursive;font-weight:400;font-size:64px;line-height:1.1;color:var(--terracotta);margin:14px 0 30px;text-align:center}
  .tagline{font-size:16px;font-weight:300;color:var(--slate);margin:0 0 32px;text-align:center}

  .countdown{width:100%;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:18px 0;display:grid;grid-template-columns:repeat(4,1fr);align-items:end}
  .unit{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
  .unit + .unit::before{content:':';position:absolute;left:-4px;top:2px;font-size:28px;color:var(--terracotta);font-weight:300}
  .unit .val{font-family:'DM Serif Display',serif;font-size:34px;font-weight:400;line-height:1;color:var(--terracotta)}
  .unit .lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--slate)}

  .note{font-size:13px;font-weight:300;color:var(--slate);margin:26px 0 0}
  .note em{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:var(--terracotta)}

</style>
</head>
<body>
<main class="card">
  <img class="flor flor-top" src="img/Flores/flor01.png" alt="">
  <img class="flor flor-mid" src="img/Flores/flor02.png" alt="">
  <img class="flor flor-bot" src="img/Flores/flor03.png" alt="">

  <h1 class="fade d1">Save the date</h1>

  <div class="photos">
    <figure class="photo fade d2" style="margin:0">
      <img src="img/save/img01.png" alt="Nancy y Pedro" style="object-position:50% 30%">
      <span class="num">23</span>
    </figure>
    <figure class="photo fade d3" style="margin:0">
      <img src="img/save/img02.png" alt="Anillo de compromiso" style="object-position:52% 50%">
      <span class="num">01</span>
    </figure>
    <figure class="photo fade d4" style="margin:0">
      <img src="img/save/img03.png" alt="Nancy y Pedro" style="object-position:50% 36%">
      <span class="num">27</span>
    </figure>
  </div>

  <p class="eyebrow fade d5">Para nuestra boda</p>
  <h2 class="fade d4">Nancy &amp; Pedro</h2>
  <p class="tagline fade d6">Esperamos celebrar contigo</p>

  <section class="countdown fade d7" aria-label="Cuenta regresiva">
    <div class="unit"><span class="val" id="cd-days">143</span><span class="lbl">días</span></div>
    <div class="unit"><span class="val" id="cd-hours">00</span><span class="lbl">horas</span></div>
    <div class="unit"><span class="val" id="cd-min">00</span><span class="lbl">min</span></div>
    <div class="unit"><span class="val" id="cd-sec">00</span><span class="lbl">seg</span></div>
  </section>

  <p class="note fade d8">Invitación formal <em>próximamente</em></p>

</main>

<script>
/* ---------- CUENTA REGRESIVA ---------- */
var TARGET = new Date(2027, 0, 23, 0, 0, 0); // 23 de enero de 2027, 00:00 hora local

function pad(n){ return String(Math.max(0, n)).padStart(2, '0'); }

function tick(){
  var diff = Math.max(0, TARGET.getTime() - Date.now());
  var s = Math.floor(diff / 1000);
  document.getElementById('cd-days').textContent  = Math.floor(s / 86400);
  document.getElementById('cd-hours').textContent = pad(Math.floor(s / 3600) % 24);
  document.getElementById('cd-min').textContent   = pad(Math.floor(s / 60) % 60);
  document.getElementById('cd-sec').textContent   = pad(s % 60);
}
tick();
setInterval(tick, 1000);

</script>
</body>
</html>
